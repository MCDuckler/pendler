# Build Mail Coach for iPhone, unsigned, and publish it as a GitHub Release.
#
# SideStore signs the app on the phone with your own Apple ID, so no certificates,
# profiles or Apple credentials ever touch this workflow. The build is ad-hoc signed
# here only so the app-group entitlement travels with the binaries — SideStore reads
# it from there to register the group the widget shares with the app.
#
# The repo is private, so the release is not something a phone can download. The
# WetOwl box polls releases (gh on the box), re-hosts the ipa under
# https://89-58-49-140.nip.io/mail/app/ and serves the SideStore source from there;
# latest.json below already points at that address.
name: iPhone app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: write

defaults:
  run:
    working-directory: .

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Version
        id: v
        run: |
          # Marketing version from the tag (v0.2.0 → 0.2.0), else from project.yml.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then ver="${GITHUB_REF#refs/tags/v}"; else ver="$(grep -E '^ +MARKETING_VERSION: "' project.yml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"; fi
          [[ "$ver" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::bad version '$ver'"; exit 1; }
          # Build number = UTC stamp: always increasing, so SideStore sees updates.
          build="$(date -u +%Y%m%d%H%M)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=ios-$ver-$build" >> "$GITHUB_OUTPUT"

      - name: Build, unsigned
        run: |
          set -o pipefail
          xcodebuild -project MailCoach.xcodeproj -scheme MailCoach \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.v.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.v.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:|\*\* BUILD" build.log | head -60; echo "::error::build failed"; exit 1; }
          grep -E "warning:|\*\* BUILD" build.log | grep -v "appintentsmetadataprocessor" | head -40 || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      - name: Ad-hoc sign with entitlements
        run: |
          app=build/Build/Products/Release-iphoneos/MailCoach.app
          ls "$app/PlugIns" || { echo "::error::widget extension not embedded"; exit 1; }
          # Inner bundle first, then the app around it.
          codesign --force --sign - --entitlements Resources/Widgets.entitlements "$app/PlugIns/MailCoachWidgets.appex"
          codesign --force --sign - --entitlements Resources/MailCoach.entitlements "$app"
          codesign -d --entitlements - "$app/PlugIns/MailCoachWidgets.appex" 2>/dev/null | grep -q application-groups
          codesign -d --entitlements - "$app" 2>/dev/null | grep -q application-groups

      - name: Wrap as ipa
        run: |
          # An ipa is a zip with the .app inside a folder called Payload.
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/MailCoach.app out/Payload/
          cd out && zip -qry MailCoach.ipa Payload && ls -lh MailCoach.ipa
          shasum -a 256 MailCoach.ipa | cut -d' ' -f1 > sha256.txt
          stat -f%z MailCoach.ipa > size.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MailCoach-ipa
          path: out/MailCoach.ipa
          retention-days: 30

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # What the app's update check reads (the box copies it to /mail/app/latest.json).
          python3 - <<'PY'
          import json, subprocess, datetime
          notes = subprocess.run(["git", "log", "-1", "--format=%s"], capture_output=True, text=True).stdout.strip()
          json.dump({"version": "${{ steps.v.outputs.version }}", "build": "${{ steps.v.outputs.build }}",
                     "bytes": int(open("out/size.txt").read().strip()),
                     "sha256": open("out/sha256.txt").read().strip(),
                     "built": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                     "url": "https://89-58-49-140.nip.io/mail/app/MailCoach.ipa", "notes": notes},
                    open("out/latest.json", "w"), indent=2)
          PY
          cat out/latest.json
          gh release create "${{ steps.v.outputs.tag }}" out/MailCoach.ipa out/latest.json source/icon.png \
            --title "Mail Coach ${{ steps.v.outputs.version }} (${{ steps.v.outputs.build }})" \
            --notes "Unsigned build of ${GITHUB_SHA::7}. Install through SideStore from https://89-58-49-140.nip.io/mail/app/source.json"
