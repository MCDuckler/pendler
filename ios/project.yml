# XcodeGen spec — `xcodegen` regenerates MailCoach.xcodeproj from this.
name: MailCoach
options:
  bundleIdPrefix: dance.duckduck
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Built unsigned on CI (then ad-hoc signed with the entitlements, so SideStore
    # sees the app group); SideStore signs for real on the phone.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  MailCoach:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: UI
      - path: Shared
      - path: Resources/Assets.xcassets
    dependencies:
      - target: MailCoachWidgets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Mail Coach
        CFBundleName: MailCoach
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: dance.duckduck.mailcoach
            CFBundleURLSchemes: [mailcoach]
        LSApplicationQueriesSchemes: [sidestore, altstore]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [dance.duckduck.mailcoach.refresh]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dance.duckduck.mailcoach
        CODE_SIGN_ENTITLEMENTS: Resources/MailCoach.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MailCoachWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Resources/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Mail Coach
        CFBundleName: MailCoachWidgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dance.duckduck.mailcoach.widgets
        CODE_SIGN_ENTITLEMENTS: Resources/Widgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"

schemes:
  MailCoach:
    build:
      targets:
        MailCoach: all
        MailCoachWidgets: all
    run:
      config: Debug
    archive:
      config: Release
