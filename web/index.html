<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#faf9f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pendler</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Liquid-glass refraction filter. Only engines that actually render SVG
       displacement over backdrop-filter (Chromium) get wired to it via the
       .glass-lens class set in app.js; Safari/Firefox keep the frosted base. -->
  <svg class="glass-svg" aria-hidden="true" width="0" height="0" focusable="false">
    <defs>
      <filter id="glass-displace" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.012" numOctaves="2" seed="7" result="noise"/>
        <feGaussianBlur in="noise" stdDeviation="1.4" result="soft"/>
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="40" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div id="app">
    <header class="app-header">
      <div class="header-content">
        <h1 id="app-title">Pendler</h1>
        <div class="header-right">
          <span id="header-date" class="header-date"></span>
          <button class="header-gear" onclick="openSettings()" aria-label="Einstellungen">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="app-content">
      <div id="view-dashboard"></div>
      <div id="view-navigator" class="hidden"></div>
    </main>

    <nav class="tab-bar" role="tablist" aria-label="Ansicht wechseln">
      <button class="tab-item active" id="tab-dashboard" role="tab" aria-selected="true" onclick="switchTab('dashboard')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16"/><circle cx="8.5" cy="14" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="14" r="1.1" fill="currentColor" stroke="none"/><path d="M8 21l1.5-2M16 21l-1.5-2"/>
        </svg>
        <span>Pendler</span>
      </button>
      <button class="tab-item" id="tab-navigator" role="tab" aria-selected="false" onclick="switchTab('navigator')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="currentColor" stroke="none"/>
        </svg>
        <span>Navigator</span>
      </button>
    </nav>
  </div>

  <div id="settings-overlay" class="settings-overlay hidden">
    <div class="settings-backdrop" onclick="closeSettings()"></div>
    <div class="settings-sheet">
      <div class="settings-header">
        <span class="settings-title">Einstellungen</span>
        <button class="settings-done" onclick="closeSettings()">Fertig</button>
      </div>
      <div id="settings-content" class="settings-content"></div>
    </div>
  </div>

  <div id="search-overlay" class="search-overlay hidden">
    <div class="search-modal">
      <div class="search-header">
        <div class="search-input-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="Station suchen..." autocomplete="off" autocorrect="off" spellcheck="false">
        </div>
        <button id="search-cancel" class="search-cancel">Abbrechen</button>
      </div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
